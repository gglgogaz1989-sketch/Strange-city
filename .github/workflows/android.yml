name: Strange City Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # ВАЖНО: Мы запускаем 'gradle build', а не './gradlew build'
    # Это работает, потому что 'setup-gradle' устанавливает gradle в систему
    - name: Build Project
      run: gradle build --no-daemon
      
