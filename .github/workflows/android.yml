name: Strange City Build CI

on:
  push:
    branches: [ "main" ] # Запускать при каждом пуше в главную ветку
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Используем Linux сервер для сборки

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17 # Устанавливаем Java (версия 17+ нужна для LWJGL 3)
      uses: actions/setup-java@v4
      with:
        java-package: jdk
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
      
