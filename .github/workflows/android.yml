name: Strange City Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Делаем файл сборки исполняемым
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    # Собираем всё: и JAR, и APK
    - name: Build with Gradle
      run: gradle build --no-daemon

    # Выгружаем APK для телефона
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StrangeCity-Android-Phone
        path: android/build/outputs/apk/debug/*.apk

    # Выгружаем JAR для ПК/Лаунчера
    - name: Upload Desktop JAR
      uses: actions/upload-artifact@v4
      with:
        name: StrangeCity-PC-Version
        path: desktop/build/libs/*.jar
        
