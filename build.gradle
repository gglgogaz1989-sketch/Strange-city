plugins {
    id 'java'
    id 'com.android.application' version '8.2.0' // Плагин для APK
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace "com.strangecity"
    compileSdk 34

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml' // Манифест в корне
            java.srcDirs = ['src']                // Твоя папка с кодом
            assets.srcDirs = ['assets']            // Твои картинки
        }
    }

    defaultConfig {
        applicationId "com.strangecity"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    // Библиотеки LibGDX для работы игры
    implementation "com.badlogicgames.gdx:gdx:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-backend-android:1.12.1"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a"
}
