plugins {
    id 'java'
    id 'application'
}

group 'com.strangecity'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

project.ext.lwjglVer = "3.3.3"
project.ext.jomlVer = "1.10.5"

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVer")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb" // <-- ДОБАВИЛ ЭТО
    implementation "org.joml:joml:$jomlVer"
    
    runtimeOnly "org.lwjgl:lwjgl::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-linux" // <-- И ЭТО
}

application {
    mainClass = 'com.strangecity.core.Main'
}
