apply plugin: 'com.android.application'

android {
    // namespace должен совпадать с твоим пакетом
    namespace "com.strangecity"
    compileSdk 34

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            // ВАЖНО: Указываем путь к текстурам в модуле core
            assets.srcDirs = ['../core/src/assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        applicationId "com.strangecity"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // Исключаем лишние файлы, чтобы не было конфликтов при сборке
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

configurations { natives }

dependencies {
    // Подключаем наш основной код игры
    implementation project(':core')
    
    // Зависимости LibGDX для Android
    implementation "com.badlogicgames.gdx:gdx-backend-android:1.12.1"
    
    // Нативные библиотеки для работы на разных процессорах телефонов
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86_64"
}

// Специальная задача для копирования нативных библиотек перед сборкой
task copyNatives {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def outputDir = file("libs/${jar.name.contains('arm64-v8a') ? 'arm64-v8a' : (jar.name.contains('armeabi-v7a') ? 'armeabi-v7a' : (jar.name.contains('x86_64') ? 'x86_64' : 'x86'))}")
            if (!outputDir.exists()) outputDir.mkdirs()
            copy {
                from zipTree(jar)
                into outputDir
                include "*.so"
            }
        }
    }
}

tasks.whenTaskAdded { packageTask ->
    if (packageTask.name.contains("package")) {
        packageTask.dependsOn copyNatives
    }
}

